// Regression fixtures run in a disposable production server, never in the release jar.
allprojects {
    afterEvaluate {
        sourceSets {
            reviewRuntime {
                java.srcDir 'tools/review/java'
                compileClasspath = sourceSets.main.compileClasspath + sourceSets.main.output
            }
        }
        tasks.register('reviewRuntimeJar', Jar) {
            dependsOn tasks.named('reviewRuntimeClasses')
            archiveBaseName = 'crime-review-runtime-checks'
            from sourceSets.reviewRuntime.output
            from('tools/review/resources')
            doFirst { manifest.attributes.remove('MixinConfigs') }
        }
        reobf { reviewRuntimeJar {} }
        tasks.named('reviewRuntimeJar').configure { finalizedBy 'reobfReviewRuntimeJar' }
    }
}
