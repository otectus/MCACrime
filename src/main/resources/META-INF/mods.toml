modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

# MCA: Crime is meaningless without MCA Reborn, so MCA is a mandatory dependency.
# We load AFTER MCA so its entities, professions, and registries are present.
[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="mca"
    mandatory=true
    versionRange="[7.6,8)"
    ordering="AFTER"
    side="BOTH"
# Architectury is deliberately NOT declared. MCA: Crime names no Architectury type (its build only
# puts it on the dev runtime classpath because MCA needs it there), and MCA Reborn declares its own
# Architectury dependency. A redundant mandatory=true edge here would refuse to load MCA: Crime on
# any future MCA that stops needing Architectury.

# Shaped mask armor models.
[[dependencies.${mod_id}]]
    modId="geckolib"
    mandatory=true
    versionRange="${geckolib_version_range}"
    ordering="AFTER"
    side="BOTH"

# MCA: Reputation — OPTIONAL. When present it owns public/community standing and MCA: Crime becomes
# the single producer for villager assault/death; when absent Crime uses its own fallback store.
# AFTER so the Reputation API is registered before our bridge handshakes with it.
[[dependencies.${mod_id}]]
    modId="mcareputation"
    mandatory=false
    versionRange="[0.2,)"
    ordering="AFTER"
    side="BOTH"

# MCA: Quests, Townstead and Ultima Kingdoms are OPTIONAL companions reached by name at runtime
# (compat/McaQuestsBridge, compat/TownsteadBridge, api/InstitutionalServiceApi and
# api/JurisdictionPolicyApi). Declared for load ordering only: "[0,)" rather than a floor because
# Forge enforces an optional range when the mod IS present, and each bridge already handles an
# incompatible companion with one log line and a disabled integration (the convention MCA: Mob
# Compatibility's mods.toml documents). AFTER so their registries exist before our setup reads them.
[[dependencies.${mod_id}]]
    modId="mcaquests"
    mandatory=false
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="townstead"
    mandatory=false
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="ultima_kingdoms"
    mandatory=false
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"
