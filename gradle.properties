# Memory for the NeoForm decompile/setup. Daemon off to avoid stale-JDK daemons.
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=false
# The JDK is NOT pinned here on purpose. build.gradle sets
# java.toolchain.languageVersion = 21 and settings.gradle applies the foojay resolver, so
# Gradle finds (or fetches) a JDK 21 on any machine. An absolute org.gradle.java.home makes
# the build unusable on every other developer's box.

## Minecraft / NeoForge
minecraft_version=1.21.1
# Bounded to 1.21.1 on purpose: the payload stream codecs, the lookup-aware SavedData signatures,
# the data attachments and the MCA 1.21.1 dependency are all 1.21.1-specific, and the `mca` range
# does not constrain the Minecraft version on its own.
minecraft_version_range=[1.21.1,1.21.2)
neoforge_version=21.1.248
# Bounded above at 21.2 so the artifact can never be loaded on a 1.21.2+ game. The lower bound is
# the version this is built against; it sits inside the ranges the sibling MCA add-ons accept, so
# all of them co-install.
neoforge_version_range=[21.1.248,21.2)
loader_version_range=[4,)

# Parchment parameter names. Matches what MCA 1.21.1 and the sibling mods build against.
parchment_minecraft=1.21.1
parchment_version=2024.11.17

## Dependencies
# MCA Reborn for 1.21.1 NeoForge, from the official Conczin Maven. The loader is in the artifact id
# (mca-neoforge), so unlike the Modrinth Maven there is no Fabric/NeoForge ambiguity to disambiguate.
#
# RUNTIME ONLY. Nothing in src/main/java references an MCA type: every MCA class and member is
# resolved by name at runtime by compat.mca.McaBinding, so one jar works across MCA's package-root
# migrations. This version is therefore only what dev runClient/runServer launches with.
#
# NOTE 7.7.36+1.21.1 was never published; -beta.3 is the real latest. The newest non-prerelease is
# 7.7.33+1.21.1.
mca_version=7.7.36-beta.3+1.21.1
# Runtime MCA range accepted by neoforge.mods.toml: the whole 7.7 line, as in the other ports. Until
# 0.7.5 this was an exact pin to 7.7.36-beta.3+1.21.1, which refused to launch beside any other MCA
# build. It was widened only after mca_probe_versions grew to span the line, from its floor (7.7.0) to
# the newest build, and McaBindingProbeTest resolved the whole manifest on each. Add a new MCA build to
# mca_probe_versions before claiming it here.
mca_version_range=[7.7,8)
# Every MCA build McaBindingProbeTest replays the binding manifest against, comma-separated, each in
# its own class loader. Only 1.21.1 NeoForge artifacts belong here: a 1.20.1 jar's Minecraft method
# descriptors are ABI-incompatible and would make the probe report false failures. A plain version comes
# from the Conczin Maven; an eight-character Modrinth version id comes from Modrinth, for builds the
# Conczin Maven does not carry. EGdYukBI is 7.7.0+1.21.1, the floor of mca_version_range; 7.7.33 is the
# newest release and 7.7.36-beta.3 the newest build. The same fleet as the other ports' probes.
mca_probe_versions=EGdYukBI,7.7.13+1.21.1,7.7.22+1.21.1,7.7.33+1.21.1,7.7.36-beta.3+1.21.1
# NOTE: Architectury is deliberately absent. MCA's 1.21.1 NeoForge artifact does not use it at all,
# and this mod contains no Architectury reference of any kind.

## Mod metadata
mod_id=mcacrime
mod_name=MCA: Crime
# GPL-3.0 to match MCA Reborn, whose internals this mod links against. See the LICENSE file.
mod_license=GPL-3.0-only
# Unchanged by the 1.21.1/NeoForge port: the platform is carried by the artifact's MC/loader
# targeting (see the minecraft and neoforge dependency ranges), not by the mod's own version number.
mod_version=0.7.6
mod_group_id=dev.otectus.mcacrime
mod_authors=otectus
# NOTE: non-ASCII must be written as a \uXXXX escape. Gradle reads this file with the Java
# Properties charset (ISO-8859-1), so a literal UTF-8 character here arrives as mojibake and is
# written into neoforge.mods.toml as invalid UTF-8 - which NightConfig refuses to parse, and FML
# then reports as "not a valid mod file". Keep this description pure ASCII.
mod_description=A server-authoritative village law-and-crime framework for Minecraft Comes Alive: Reborn.
