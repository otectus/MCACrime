        'dev/otectus/mcacrime/captivity/CustodyReleaseReason',
        'dev/otectus/mcacrime/captivity/RestraintType',
        'dev/otectus/mcacrime/civic/CivicTask',
        'dev/otectus/mcacrime/civic/ServiceContract',
        'dev/otectus/mcacrime/compat/TownsteadBuildingView',
        'dev/otectus/mcacrime/crime/Band',
        'dev/otectus/mcacrime/crime/KarmaSource',
        'dev/otectus/mcacrime/detention/DetentionKind',
        'dev/otectus/mcacrime/detention/DetentionRecord',
        'dev/otectus/mcacrime/dialogue/DialogueContext',
        'dev/otectus/mcacrime/economy/Currency',
        'dev/otectus/mcacrime/economy/TransactionReason',
        'dev/otectus/mcacrime/economy/account/ReconciliationDecision',
