plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Minecraft 1.18+ ships Java 17; target it explicitly (system default JDK is 21).
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    // Required for this template's processResources/run setup.
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content { includeGroup 'software.bernie.geckolib' }
    }
    // Architectury API (hard runtime dependency of MCA Reborn's Forge build).
    maven { url = 'https://maven.architectury.dev/' }

    // MCA Reborn via Modrinth Maven. exclusiveContent keeps this repo scoped to the
    // maven.modrinth group and routes resolution through ForgeGradle's deobf pipeline.
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        forRepositories(fg.repository)
        filter { includeGroup 'maven.modrinth' }
    }
}

// Every MCA build McaBindingProbeTest verifies the manifest against, one configuration each. Two
// versions of the same module cannot share a configuration -- Gradle's conflict resolution would
// collapse them to the newer and the older package root would go untested, which is how MCA's rename
// reached players in the first place. Each is probed in its own class loader.
ext.mcaProbeVersions = (project.findProperty('mcaProbeVersions') ?: mca_probe_versions)
        .toString().split(',').collect { it.trim() }.findAll { !it.isEmpty() }

configurations {
    // Keep MCA off the unit-test runtime. Gradle's testRuntimeOnly extends runtimeOnly, so the dev-run
    // MCA jar would otherwise land on testRuntimeClasspath -- and the unit suite is precisely where
    // "MCA is absent" has to be the real, exercised state. McaBindingProbeTest still reaches the real
    // MCA jars, by opening each in a throwaway class loader rather than by having them on the classpath.
    testRuntimeClasspath {
        exclude group: 'maven.modrinth', module: 'minecraft-comes-alive-reborn'
    }
}

mcaProbeVersions.eachWithIndex { version, i ->
    configurations.create("mcaProbe${i}") {
        canBeConsumed = false
        // Just the MCA jar: the probe opens it against the test classloader, which already carries
        // Minecraft, and pulling MCA's own dependency graph in would only slow the build.
        transitive = false
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation fg.deobf("software.bernie.geckolib:geckolib-forge-${minecraft_version}:${geckolib_version}")

    // MCA Reborn — obfuscated production (Universal) jar, remapped to our dev mappings by fg.deobf.
    //
    // runtimeOnly, NOT implementation: no class in src/main/java names an MCA type any more, because
    // compat.mca.McaBinding resolves every MCA class and member by name at runtime. That is what lets
    // one jar serve both MCA's forge.net.mca.* layout and the renamed forge.net.conczin.mca.* one. A
    // compile dependency would only invite the static linkage back -- NoMcaStaticLinkTest fails the
    // build if it ever returns. runtimeOnly also keeps MCA off testRuntimeClasspath, so the unit suite
    // exercises the genuine "MCA absent" degradation path rather than a half-bound one.
    runtimeOnly fg.deobf("maven.modrinth:minecraft-comes-alive-reborn:${mca_version}")

    // The probe fleet McaBindingProbeTest replays the manifest against (see ext.mcaProbeVersions).
    // Deliberately NOT fg.deobf: only Minecraft's methods and fields carry SRG names in a production
    // jar, never its class names, so MCA's own declarations already read as e.g.
    // `getMemoriesForPlayer(net.minecraft.world.entity.player.Player)` -- exactly what the manifest
    // compares against. Skipping the deobf round-trip also keeps these configurations out of
    // ForgeGradle's remap pipeline, which cannot serve one resolved from a test task's doFirst.
    mcaProbeVersions.eachWithIndex { version, i ->
        add("mcaProbe${i}", "maven.modrinth:minecraft-comes-alive-reborn:${version}")
    }

    // Architectury API (Forge) — MCA 7.6's Forge build needs it on the dev run classpath, and MCA: Crime
    // names not one Architectury symbol. runtimeOnly rather than implementation so the dev runs keep
    // working while an accidental `import dev.architectury.*` becomes a compile error instead of a
    // silent success. (MCA 7.7 drops Architectury entirely, which is why mods.toml no longer requires it.)
    runtimeOnly fg.deobf("dev.architectury:architectury-forge:${architectury_version}")

    // Native cuff lockpicking menu, isolated behind LocksReforgedBridge. Never bundled or required
    // at runtime. A pinned published artifact also makes standalone clones include the adapter.
    compileOnly fg.deobf('maven.modrinth:locks-reforged:1.7.3')

    // MCA: Reputation — OPTIONAL integration, compile-only. The sibling mod is not published to a
    // Maven, so we compile against its dev-mapped class output; both mods use `official` 1.20.1
    // mappings, so the Minecraft type names line up and reobfJar remaps our own references for
    // production. Never bundled: the real mod supplies these classes at runtime, and everything that
    // touches them is gated behind ReputationBridge's ModList check.
    //
    // When the sibling is absent the adapter package is excluded from compilation rather than failing
    // the build. A standalone clone of this repo must be buildable — ReputationBridge reaches the
    // adapter by name, so a missing class is the ClassNotFoundException its catch block already
    // handles, and the mod behaves exactly as it does with Reputation uninstalled. CI that must
    // include the adapter passes -PrequireReputation=true.
    def mcaReputationClasses = file("${projectDir}/../MCAReputation/build/classes/java/main")
    if (mcaReputationClasses.exists()) {
        compileOnly files(mcaReputationClasses)
    } else if (project.hasProperty('requireReputation')) {
        throw new GradleException("-PrequireReputation was set but ${mcaReputationClasses} does not exist. " +
                "Build it first: (cd ../MCAReputation && ./gradlew classes)")
    } else {
        sourceSets.main.java { exclude 'dev/otectus/mcacrime/compat/reputation/**' }
        logger.warn("MCA: Reputation classes not found at ${mcaReputationClasses}; building WITHOUT the " +
                "optional Reputation adapter. Build ../MCAReputation (./gradlew classes) to include it.")
    }

    // MCA: Quests — OPTIONAL integration, compile-only, on exactly the same terms as MCA: Reputation
    // above: dev-mapped class output of the sibling project, never bundled, and the adapter package
    // excluded from compilation when the sibling is absent so a standalone clone still builds.
    // McaQuestsBridge reaches compat/mcaquests by name, so a missing class is the
    // ClassNotFoundException its catch block already handles and bounties are simply not offered as
    // quests. CI that must include the adapter passes -PrequireQuests=true.
    def mcaQuestsClasses = file("${projectDir}/../MCAQuests/build/classes/java/main")
    if (mcaQuestsClasses.exists()) {
        compileOnly files(mcaQuestsClasses)
    } else if (project.hasProperty('requireQuests')) {
        throw new GradleException("-PrequireQuests was set but ${mcaQuestsClasses} does not exist. " +
                "Build it first: (cd ../MCAQuests && ./gradlew classes)")
    } else {
        sourceSets.main.java { exclude 'dev/otectus/mcacrime/compat/mcaquests/**' }
        logger.warn("MCA: Quests classes not found at ${mcaQuestsClasses}; building WITHOUT the " +
                "optional bounty-contract adapter. Build ../MCAQuests (./gradlew classes) to include it.")
    }

    // Unit tests for the non-MCA karma/heat engine (spec section 18).
    // The mixin annotation processor generates the refmap that remaps `official` member names to SRG
    // for a production jar. Without it the mixin applies in dev and silently fails in the wild.
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    // The MCA jars travel as paths, not a classpath: McaBindingProbeTest opens each in its own
    // URLClassLoader, so the binding manifest is verified against real MCA without a single MCA class
    // being linked into the test JVM.
    //
    // Resolved in doFirst, not at configuration time: resolving a configuration while the build is
    // still being configured freezes ForgeGradle's deobf repository before every fg.deobf dependency
    // is registered ("cannot mutate content repository descriptor after repository has been used").
    doFirst {
        systemProperty 'mcacrime.probe.jars', mcaProbeVersions.indices
                .collect { i -> configurations.getByName("mcaProbe${i}").files }
                .flatten()
                .findAll { it.name.contains('minecraft-comes-alive') }
                .join(File.pathSeparator)
    }
}

// Resolves TownsteadBinding's manifest against a real Townstead jar, in its own JVM and its own class
// loader. Separate from `test` because it needs a jar nobody can resolve from a Maven: Townstead is
// published on CurseForge only, so the path is supplied by the person running it.
// TownsteadBindingProbeTest itself stays in the ordinary `test` run and skips there on an assumption,
// exactly as McaBindingProbeTest does when no jar resolves -- one test class, two ways of reaching it,
// and no exclusion filter anybody has to remember to keep in step.
//
//     ./gradlew townsteadProbeTest -PtownsteadLegacyJar=/path/townstead-0.7.7+1.20.1.jar
//     ./gradlew townsteadProbeTest -PtownsteadModernJar=/path/townstead-0.7.7+1.20.1.jar
//
// Either property may be given alone; with neither, the task skips with one line and does not fail.
//
// Each Townstead jar is opened together with *its own* MCA build, and that pairing is load-bearing.
// Townstead is compiled against MCA, so enumerating TownsteadAPI's methods resolves an MCA parameter
// type; with no MCA on the loader the whole class reads as unbound and the probe would pass vacuously.
// The legacy variant is built against MCA 7.7.0-beta.2 and the modern one against 7.7.1-alpha.2 -- both
// already resolved for McaBindingProbeTest, so the existing mcaProbe<N> configurations are reused
// rather than a second copy of the same jars being declared.
ext.townsteadProbePairs = ['townsteadLegacyJar': '7.7.0-beta.2+1.20.1',
                           'townsteadModernJar': '7.7.1-alpha.2+1.20.1']

tasks.register('townsteadProbeTest', Test) {
    group = 'verification'
    description = 'Verifies the Townstead binding manifest against a supplied Townstead jar.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter {
        includeTestsMatching 'dev.otectus.mcacrime.compat.TownsteadBindingProbeTest'
        // The mixin layer's half of the same question. The binding probe proves the reflective manifest
        // still resolves; this proves the classes, methods and vanilla call sites the Townstead mixins
        // name are still where the annotations say they are -- which nothing else can check, because
        // those targets are strings the compiler never sees a class for.
        includeTestsMatching 'dev.otectus.mcacrime.compat.TownsteadMixinTargetTest'
    }
    outputs.upToDateWhen { false }
    testLogging { showStandardStreams = true }

    def supplied = townsteadProbePairs.keySet().findAll { project.hasProperty(it) }
    onlyIf {
        if (supplied.isEmpty()) {
            logger.lifecycle('townsteadProbeTest: no -PtownsteadLegacyJar / -PtownsteadModernJar supplied; '
                    + 'skipping (nothing to probe against).')
            return false
        }
        return true
    }

    // Resolved in doFirst for the same reason the MCA probe jars are: resolving a configuration at
    // configuration time freezes ForgeGradle's deobf repository before every fg.deobf dependency has
    // been registered.
    doFirst {
        supplied.each { property ->
            File suppliedJar = file(project.property(property))
            if (!suppliedJar.isFile() || !suppliedJar.canRead()) {
                throw new GradleException("-P${property} must name a readable Townstead jar: ${suppliedJar}")
            }
            String mcaVersion = townsteadProbePairs[property]
            int index = mcaProbeVersions.indexOf(mcaVersion)
            if (index < 0) {
                throw new GradleException("-P${property} needs MCA ${mcaVersion} on the probe classpath, "
                        + "but mca_probe_versions does not list it. Add it in gradle.properties (or pass "
                        + "-PmcaProbeVersions) so the Townstead jar is read against the MCA it was built "
                        + "for; without it every TownsteadAPI method reads as unbound and the probe would "
                        + "pass while proving nothing.")
            }
            String variant = property == 'townsteadLegacyJar' ? 'legacy' : 'modern'
            systemProperty "mcacrime.townstead.probe.${variant}Jar", suppliedJar.absolutePath
            systemProperty "mcacrime.townstead.probe.${variant}McaJars",
                    configurations.getByName("mcaProbe${index}").files
                            .findAll { it.name.contains('minecraft-comes-alive') }
                            .join(File.pathSeparator)
        }
    }
}

// Expand metadata placeholders into mods.toml / pack.mcmeta at build time.
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            geckolib_version_range: geckolib_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

// The mod ships exactly one mixin, it is client-only, and it does nothing but pose a restrained
// player's arms. Everything else in this mod reaches Minecraft through Forge events on purpose; the
// pose is the one thing no event can express, because PlayerRenderer.setModelProperties and
// HumanoidModel.setupAnim both run after RenderPlayerEvent.Pre and overwrite whatever it set.
mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
    // The Townstead config. Its mixins name their targets as dotted strings -- Townstead is never on
    // this mod's compile classpath and never may be, since its own descriptors carry relocated MCA
    // types -- but every vanilla member they redirect still has to be remapped, so the config is
    // registered here and shares `${mod_id}.refmap.json` with the main one. Without this line the
    // annotation processor would write no entries for those mixins and each redirect would resolve in
    // dev and silently miss in a production jar.
    config "${mod_id}.townstead.mixins.json"
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                // Forge reads mixin configs from this manifest attribute on 1.20.1 -- there is no
                // [[mixins]] block in this mod's mods.toml -- and multiple configs are comma-separated.
                // The second one is the Townstead layer: optional, plugin-gated, and omitted from this
                // list it would simply never be read.
                'MixinConfigs'            : "${mod_id}.mixins.json,${mod_id}.townstead.mixins.json"
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // The Townstead mixins name their targets as dotted strings, and those classes are never on this
    // mod's compile classpath -- deliberately, because Townstead is compiled against MCA and one
    // import would put a relocated MCA descriptor into MCA: Crime's constant pool. The Mixin
    // annotation processor treats a soft target it cannot resolve as an error by default, so it is
    // downgraded to a note here. Nothing is lost: what the processor would have checked is checked
    // instead by TownsteadMixinPlugin at load time, which refuses to apply a mixin whose target class
    // is not present, and by TownsteadMixinTargetTest, which reads the real class out of a Townstead
    // jar and asserts the target method is there with the shape the hook expects.
    options.compilerArgs += ['-AMSG_MIXIN_SOFT_TARGET_NOT_FOUND=note']
}

/**
 * Static jar check (integration spec §14.4): the shipped artifact must not contain a single class
 * from an optional companion mod, from Architectury, or from MCA. MCA: Crime compiles against MCA
 * and (optionally) MCA: Reputation, but ships neither — anything under those package roots means a
 * `compileOnly` was written as `implementation`, or a shadow/jarjar step crept in.
 *
 * <p>Matching is on the entry path prefix, so the deliberately namespaced datapack resources under
 * `data/mcacrime/mcareputation/incidents/` are unaffected: those are ours, in our namespace, and
 * match none of the class-package prefixes below.
 */
tasks.register('checkJarContents') {
    dependsOn tasks.named('jar')
    doLast {
        def forbidden = ['dev/otectus/mcareputation/', 'dev/otectus/mcaquests/',
                         'dev/otectus/mcaconversations/', 'dev/architectury/',
                         'me/shedaniel/', 'forge/net/mca/', 'net/mca/',
                         'forge/net/conczin/mca/', 'net/conczin/mca/',
                         'com/aetherianartificer/townstead/',
                         'locks/', 'melonslise/locks/']
        def jarFile = tasks.named('jar').get().archiveFile.get().asFile
        def offenders = []
        new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
            zip.entries().each { entry ->
                if (forbidden.any { entry.name.startsWith(it) }) {
                    offenders << entry.name
                }
            }
        }
        if (!offenders.isEmpty()) {
            throw new GradleException("Shaded classes found in ${jarFile.name}: ${offenders.take(20)}")
        }
        logger.lifecycle("checkJarContents: ${jarFile.name} is clean (no shaded companion/Architectury/MCA classes).")
    }
}

tasks.named('build').configure {
    dependsOn 'checkJarContents'
}
