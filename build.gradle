def apiExports = ['dev/otectus/mcacrime/api/**'] + apiReadModel.collectMany { [it + '.class', it + '$*.class'] }

tasks.register('apiJar', Jar) {
    // Reproducible: no entry timestamps and a fixed entry order, so a rebuild from the same sources yields
    // the same bytes and the SHA-256 pins in consumers' gradle/sibling-apis.properties survive it.
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    group = 'build'
    description = 'Compile-only API artifact for sibling add-ons; classes only, official mappings.'
    dependsOn 'compileJava'
    archiveClassifier = 'api'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(sourceSets.main.output.classesDirs) {
        include apiExports
    }
    manifest {
        attributes([
                'Specification-Title'   : "${mod_id}-api".toString(),
                'Specification-Version' : mod_version.toString(),
                'Implementation-Title'  : "${mod_id}-api".toString()
        ])
    }
}

tasks.named('assemble').configure {
    dependsOn 'apiJar'
}

tasks.register('verifyApiJar') {
    group = 'verification'
    description = 'Fails if the api jar is missing an exported class or has leaked resources into it.'
    dependsOn 'apiJar'
    def apiArchive = tasks.named('apiJar', Jar).flatMap { it.archiveFile }
    def required = apiReadModel.collect { it + '.class' }
    inputs.file(apiArchive)
    doLast {
        def jarFile = apiArchive.get().asFile
        def names = new java.util.zip.ZipFile(jarFile).withCloseable { zip -> zip.entries().collect { it.name } }
        if (!names.any { it.startsWith('dev/otectus/mcacrime/api/') }) {
            throw new GradleException("${jarFile.name} carries no dev/otectus/mcacrime/api/ classes at all; " +
                    'the export filter matched nothing.')
        }
        def missing = required.findAll { !names.contains(it) }
        if (missing) {
            throw new GradleException("${jarFile.name} is missing read-model class(es): ${missing}; " +
                    'a class in apiReadModel was renamed or removed.')
        }
        def resources = names.findAll { !it.endsWith('.class') && !it.endsWith('/') && !it.startsWith('META-INF/') }
        if (resources) {
            throw new GradleException("${jarFile.name} leaked resources into the api jar: ${resources.take(10)}")
        }
        logger.lifecycle("verifyApiJar: ${jarFile.name} is a clean compile-only API artifact " +
                "(${names.count { it.endsWith('.class') }} classes).")
    }
}

tasks.named('check').configure {
    dependsOn 'verifyApiJar'
}

/**
 * Static jar check (integration spec §14.4): the shipped artifact must not contain a single class
 * from an optional companion mod, from Architectury, or from MCA. MCA: Crime compiles against MCA
 * and (optionally) MCA: Reputation, but ships neither — anything under those package roots means a
 * `compileOnly` was written as `implementation`, or a shadow/jarjar step crept in.
 *
 * <p>Matching is on the entry path prefix, so the deliberately namespaced datapack resources under
 * `data/mcacrime/mcareputation/incidents/` are unaffected: those are ours, in our namespace, and
 * match none of the class-package prefixes below.
 */
tasks.register('checkJarContents') {
    dependsOn tasks.named('jar')
    doLast {
        def forbidden = ['dev/otectus/mcareputation/', 'dev/otectus/mcaquests/',
                         'dev/otectus/mcaconversations/', 'dev/architectury/',
                         'me/shedaniel/', 'forge/net/mca/', 'net/mca/',
                         'forge/net/conczin/mca/', 'net/conczin/mca/',
                         'com/aetherianartificer/townstead/',
                         'locks/', 'melonslise/locks/']
        def jarFile = tasks.named('jar').get().archiveFile.get().asFile
        def offenders = []
        new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
            zip.entries().each { entry ->
                if (forbidden.any { entry.name.startsWith(it) }) {
                    offenders << entry.name
                }
            }
        }
        if (!offenders.isEmpty()) {
            throw new GradleException("Shaded classes found in ${jarFile.name}: ${offenders.take(20)}")
        }
        logger.lifecycle("checkJarContents: ${jarFile.name} is clean (no shaded companion/Architectury/MCA classes).")
    }
}

tasks.named('build').configure {
    dependsOn 'checkJarContents'
}
