        'dev/otectus/mcacrime/restraint/AppliedRestraint',
        'dev/otectus/mcacrime/restraint/PhysicalRestraintState',
        'dev/otectus/mcacrime/restraint/RestraintAction',
        'dev/otectus/mcacrime/restraint/RestraintApplier',
        'dev/otectus/mcacrime/restraint/RestraintDefinition',
        'dev/otectus/mcacrime/restraint/RestraintFamily',
        'dev/otectus/mcacrime/restraint/RestraintSlot',
        'dev/otectus/mcacrime/restraint/RestrictionPolicy',
        'dev/otectus/mcacrime/restraint/RigProfile',
        'dev/otectus/mcacrime/state/world/AccompliceRecord',
        'dev/otectus/mcacrime/state/world/BountyClaimRecord',
        'dev/otectus/mcacrime/state/world/BountyContractRecord',
